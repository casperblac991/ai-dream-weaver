<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<script src="/js/api-client.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="شارك حلمك للحصول على قراءة تأملية بالذكاء الاصطناعي. التفسير للتأمل والترفيه وليس تشخيصاً أو فتوى دينية.">
    <title>تحليل الحلم | نَسَّاج</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Tajawal', sans-serif; background: #050210; color: #e2d9f3; min-height: 100vh; padding: 2rem; }
        .container { max-width: 760px; margin: 0 auto; }
        .back { display: inline-block; margin-bottom: 2rem; color: #f0c060; text-decoration: none; }
        h1 { margin-bottom: 1rem; color: #f0c060; }
        .intro, .disclaimer { color: rgba(226,217,243,.78); line-height: 1.8; margin-bottom: 1.25rem; }
        textarea { display: block; width: 100%; min-height: 190px; resize: vertical; padding: 1rem; border: 1px solid #553c79; border-radius: 12px; background: #110b22; color: #f4edff; font: inherit; line-height: 1.7; }
        textarea:focus, button:focus-visible, a:focus-visible { outline: 3px solid #f0c060; outline-offset: 3px; }
        button { margin: 1rem 0; border: 0; border-radius: 9px; padding: .8rem 1.3rem; background: #f0c060; color: #160e24; font: inherit; font-weight: 700; cursor: pointer; }
        button:disabled { opacity: .6; cursor: wait; }
        #loading, #error, #result { margin-top: 1rem; line-height: 1.8; }
        #error { color: #ffb4a8; }
        #result { display: none; padding: 1rem; border: 1px solid #553c79; border-radius: 12px; background: #110b22; white-space: pre-wrap; overflow-wrap: anywhere; }
        .disclaimer { margin-top: 1rem; font-size: .9rem; }
        @media (max-width: 520px) { body { padding: 1rem; } }
    </style>
</head>
<body>
<main class="container">
    <a class="back" href="/">← العودة للرئيسية</a>
    <h1>🔮 فسّر حلمك</h1>
    <p class="intro">اكتب ما تتذكره من حلمك، وسنساعدك على استكشاف دلالاته المحتملة.</p>
    <label for="dream">وصف الحلم</label>
    <textarea id="dream" maxlength="5000" placeholder="اكتب حلمك هنا..." required></textarea>
    <button id="analyzeBtn" type="button" onclick="analyzeDream()">حلل الحلم</button>
    <p id="loading" role="status" aria-live="polite" hidden>⏳ جاري التحليل...</p>
    <p id="error" role="alert" aria-live="assertive"></p>
    <section id="result" aria-live="polite" aria-label="نتيجة التحليل"></section>
    <p class="disclaimer">هذه القراءة آلية وتأملية لأغراض الترفيه، ولا تمثل تشخيصاً نفسياً أو نصيحة طبية أو حكماً شرعياً. لا تشارك معلومات شخصية حساسة.</p>
</main>
<script>
    const BACKEND_URL = 'https://ai-dream-weaver.onrender.com';
    async function analyzeDream() {
        const dream = document.getElementById('dream').value.trim();
        const btn = document.getElementById('analyzeBtn');
        const loading = document.getElementById('loading');
        const result = document.getElementById('result');
        const error = document.getElementById('error');
        if (!dream) { error.textContent = 'رجاءً اكتب الحلم أولاً.'; return; }
        btn.disabled = true;
        loading.hidden = false;
        error.textContent = '';
        result.hidden = true;
        result.textContent = '';
        try {
            const response = await fetch(`${BACKEND_URL}/api/interpret`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ dream: dream, language: 'ar', style: 'islamic' })
            });
            if (!response.ok) throw new Error(`Request failed (${response.status})`);
            const data = await response.json();
            if (data.error) throw new Error(data.error);
            const interpretation = typeof data.interpretation === 'string' ? data.interpretation.trim() : '';
            if (!interpretation) throw new Error('Empty interpretation');
            result.textContent = interpretation;
            result.hidden = false;
        } catch (err) {
            error.textContent = 'تعذر تحليل الحلم حالياً. تحقق من اتصالك وحاول مرة أخرى لاحقاً.';
            console.error(err);
        } finally {
            btn.disabled = false;
            loading.hidden = true;
        }
    }
</script>
</body>
</html>
