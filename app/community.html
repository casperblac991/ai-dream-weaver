<!doctype html><html lang="ar" dir="rtl"><head><script src="/js/api-client.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مجتمع الأحلام | نَسَّاج</title><style>body{margin:0;background:#07051a;color:#eee;font-family:Arial,Tahoma,sans-serif}.nav,main{max-width:900px;margin:auto}.nav{padding:18px 20px;display:flex;justify-content:space-between}.nav a{color:#ffd166;text-decoration:none}main{padding:20px}.card{background:#17123a;border:1px solid #7445c5;border-radius:18px;padding:20px;margin:18px 0}textarea{width:100%;min-height:100px;background:#0d0924;color:#fff;border:1px solid #7445c5;border-radius:12px;padding:12px;box-sizing:border-box}button{background:#ffd166;border:0;border-radius:22px;padding:10px 18px;margin-top:10px;cursor:pointer}.muted{color:#b8acd5}</style></head><body><nav class="nav"><a href="/">Weaver | نَسَّاج</a><a href="/app/login.html">تسجيل الدخول</a></nav><main><h1>مجتمع الأحلام</h1><p class="muted">شارك رؤيتك وتعرّف إلى تجارب الحالمين حول العالم.</p><section class="card"><textarea id="dream" placeholder="ماذا حلمت اليوم؟"></textarea><button onclick="publish()">نشر الحلم</button></section><section id="feed"><div class="card">لا توجد أحلام عامة معروضة حالياً. كن أول من يشارك تجربته.</div></section></main><script>async function load(){try{const r=await fetch('/api/public-dreams');if(!r.ok)return;const d=await r.json();if(!d.dreams?.length)return;document.getElementById('feed').innerHTML=d.dreams.map(x=>`<article class="card"><b>${esc(x.username||'حالم')}</b><p>${esc(x.dream_text||x.dream||'')}</p></article>`).join('')}catch(e){}}function publish(){const text=document.getElementById('dream').value.trim();if(text)location.href='/app/analyze.html?text='+encodeURIComponent(text)}function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}load()</script></body></html>
