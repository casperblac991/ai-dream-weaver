<!DOCTYPE html>
<html>

<head>
<script src="/js/api-client.js"></script>

<title>Dashboard - Dreamora AI</title>

<style>

body{
font-family:Arial;
background:#0f172a;
color:white;
padding:40px;
}

.container{
max-width:800px;
margin:auto;
}

textarea{
width:100%;
height:120px;
padding:10px;
border-radius:8px;
border:none;
}

button{
margin-top:10px;
padding:10px 20px;
border:none;
border-radius:8px;
background:#6366f1;
color:white;
cursor:pointer;
}

.result{
margin-top:30px;
background:#1e293b;
padding:20px;
border-radius:12px;
}

</style>

</head>

<body>

<div class="container">

<h1>🧠 Dream Analyzer</h1>

<textarea id="dreamText" placeholder="Write your dream here..."></textarea>

<br>

<label>
<input type="checkbox" id="publicDream">
Publish dream to Dream Feed
</label>

<br>

<button onclick="analyzeDream()">Analyze Dream</button>

<div id="result" class="result"></div>

</div>

<script>
const resultEl = document.getElementById('result');
const dreamTextEl = document.getElementById('dreamText');

async function analyzeDream() {
  const dream = dreamTextEl.value.trim();
  if (!dream) {
    resultEl.textContent = 'Please write your dream first.';
    return;
  }
  resultEl.textContent = 'Analyzing...';
  try {
    const response = await fetch('/api/interpret', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ dream, language: 'en', style: 'general' })
    });
    const data = await response.json();
    if (!response.ok || data.error) throw new Error(data.error || 'Request failed');
    resultEl.textContent = data.interpretation || 'No interpretation returned.';
  } catch (error) {
    console.error(error);
    resultEl.textContent = 'The AI service is unavailable right now. Please try again.';
  }
}
</script>

</body>
</html>
