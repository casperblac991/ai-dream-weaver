<!DOCTYPE html>
<html lang="{{ lang }}" dir="{% if lang == 'ar' %}rtl{% else %}ltr{% endif %}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ t('nav_personality') }} | نَسَّاج</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #7c3aed;
            --secondary: #f0c060;
            --bg: #050210;
            --text: #e2d9f3;
        }
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            background-image: radial-gradient(circle at top right, #1e1b4b, transparent);
        }
        .container {
            max-width: 800px;
            width: 90%;
            padding: 40px 20px;
            text-align: center;
        }
        h1 {
            color: var(--secondary);
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        .test-box {
            background: #1e1b4b;
            padding: 30px;
            border-radius: 20px;
            border: 1px solid rgba(124, 58, 237, 0.3);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        textarea {
            width: 100%;
            height: 150px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--primary);
            border-radius: 10px;
            color: white;
            padding: 15px;
            font-family: inherit;
            font-size: 1rem;
            margin-bottom: 20px;
            box-sizing: border-box;
        }
        .btn {
            background: linear-gradient(45deg, var(--primary), #a855f7);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔮 {{ t('nav_personality') }}</h1>
        <p>اكتشف أسرار شخصيتك الكامنة من خلال تحليل أحلامك المتكررة</p>
        
        <div class="test-box">
            <p>صف حلماً يتكرر معك أو حلماً أثر فيك مؤخراً:</p>
            <textarea id="dreamInput" placeholder="مثلاً: حلمت أنني أطير فوق مدينة مهجورة..."></textarea>
            <button class="btn" onclick="analyzePersonality()">حلل شخصيتي الآن</button>
            
            <div id="result" style="display:none; margin-top: 30px; text-align: right;">
                <h3 style="color: var(--secondary)">📊 نتيجة التحليل الأولي:</h3>
                <div id="analysisContent"></div>
                <div style="margin-top: 20px; padding: 20px; background: rgba(240, 192, 96, 0.1); border-radius: 10px;">
                    <p>✨ للحصول على تقرير الشخصية الكامل (10 صفحات) وتوصيات خاصة:</p>
                    <a href="/app/register" style="color: var(--secondary); font-weight: bold;">سجل حسابك مجاناً الآن ←</a>
                </div>
            </div>
        </div>
        
        <p style="margin-top: 40px;"><a href="/" style="color: var(--primary); text-decoration: none;">← {{ t('nav_home') }}</a></p>
    </div>

    <script>
        function analyzePersonality() {
            const dream = document.getElementById('dreamInput').value;
            if (dream.length < 10) return;
            
            document.getElementById('result').style.display = 'block';
            document.getElementById('analysisContent').innerHTML = "بناءً على الرموز التي ذكرتها، تظهر شخصيتك ميلاً نحو الإبداع والبحث عن الحرية. الحلم بالطيران يشير إلى رغبة دفينة في التحرر من قيود حالية...";
        }
    </script>
</body>
</html>
