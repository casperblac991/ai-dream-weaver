<!DOCTYPE html>
<html lang="{{ lang }}" dir="{% if lang == 'ar' %}rtl{% else %}ltr{% endif %}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ t('nav_offers') }} | نَسَّاج</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #f0c060;
            --purple: #7c3aed;
            --dark: #050210;
        }
        body {
            font-family: 'Tajawal', sans-serif;
            background: var(--dark);
            color: white;
            margin: 0;
            text-align: center;
        }
        .header {
            padding: 60px 20px;
            background: linear-gradient(to bottom, #1e1b4b, var(--dark));
        }
        .header h1 {
            font-size: 3rem;
            color: var(--gold);
        }
        .offers-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px;
            padding: 40px 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .offer-card {
            background: #1e1b4b;
            border: 1px solid rgba(240, 192, 96, 0.3);
            border-radius: 20px;
            width: 300px;
            padding: 30px;
            transition: 0.3s;
        }
        .offer-card:hover {
            transform: translateY(-10px);
            border-color: var(--gold);
        }
        .price {
            font-size: 2.5rem;
            font-weight: bold;
            margin: 20px 0;
            color: var(--gold);
        }
        .buy-btn {
            display: block;
            background: var(--purple);
            color: white;
            text-decoration: none;
            padding: 15px;
            border-radius: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>💎 {{ t('nav_offers') }}</h1>
        <p>استثمر في عالمك الداخلي مع باقاتنا المتكاملة</p>
    </div>

    <div class="offers-grid">
        <div class="offer-card">
            <h3>باقة تحليل الشخصية</h3>
            <div class="price">19$</div>
            <p>تقرير مفصل يحلل نمط حياتك من خلال أحلامك.</p>
            <a href="#" class="buy-btn">احصل عليها الآن</a>
        </div>

        <div class="offer-card">
            <h3>باقة "نَسَّاج" الذهبية</h3>
            <div class="price">39$</div>
            <p>وصول كامل وغير محدود لجميع أدوات الذكاء الاصطناعي.</p>
            <a href="#" class="buy-btn">اشترك الآن</a>
        </div>
    </div>
    
    <p style="margin-top: 40px;"><a href="/" style="color: var(--purple); text-decoration: none;">← {{ t('nav_home') }}</a></p>
</body>
</html>
