<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المدونة | Weaver</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: 'Tajawal', sans-serif;
        background: #050210;
        color: #e2d9f3;
        line-height: 1.6;
    }
    body.en { font-family: 'Inter', sans-serif; }
    .bg { position: fixed; inset: 0; z-index: -2; background: radial-gradient(ellipse at 20% 50%,#1e0a3c 0%,transparent 60%), radial-gradient(ellipse at 80% 20%,#0c0a3e 0%,transparent 50%),#050210; }
    nav {
        position: sticky; top: 0; z-index: 100;
        display: flex; justify-content: space-between; align-items: center;
        padding: .75rem 2rem;
        background: rgba(5,2,16,.9);
        backdrop-filter: blur(12px);
        border-bottom: 1px solid rgba(124,58,237,.4);
    }
    .logo { font-size: 1.4rem; font-weight: 900; display: flex; align-items: center; gap: 5px; text-decoration: none; }
    .logo-en { background: linear-gradient(135deg,#f0c060,#7c3aed); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .logo-ar { color: #a855f7; }
    .nav-links { display: flex; align-items: center; gap: 1rem; }
    .nav-links a { color: #e2d9f3; text-decoration: none; font-size: .85rem; }
    .container { max-width: 1100px; margin: 0 auto; padding: 2rem; }
    .page-title { text-align: center; margin-bottom: 3rem; }
    .page-title h1 { font-size: 2.5rem; color: #f0c060; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 2rem; }
    .card { background: rgba(30,10,60,0.6); border: 1px solid rgba(124,58,237,0.3); border-radius: 15px; padding: 1.5rem; transition: 0.3s; text-decoration: none; color: inherit; }
    .card:hover { transform: translateY(-5px); border-color: #a855f7; }
    .card h3 { color: #f0c060; margin-bottom: 1rem; }
    .card p { font-size: 0.9rem; color: rgba(226,217,243,0.7); }
    .card-meta { margin-top: 1rem; font-size: 0.8rem; color: #a855f7; display: flex; justify-content: space-between; }
</style>
</head>
<body class="ar">
<div class="bg"></div>
<nav>
    <a href="/" class="logo"><span class="logo-en">Weaver</span><span class="logo-ar">نَسَّاج</span></a>
    <div class="nav-links">
        <a href="/">الرئيسية</a>
        <a href="/app/community">المجتمع</a>
        <a href="/blog">المدونة</a>
    </div>
</nav>

<div class="container">
    <div class="page-title">
        <h1>المدونة</h1>
        <p>اكتشف أسرار الأحلام عبر الحضارات والذكاء الاصطناعي</p>
    </div>

    <div class="grid">
        
        <a href="/blog/" class="card">
            <h3></h3>
            <p></p>
            <div class="card-meta">
                <span>📅 </span>
                <span></span>
            </div>
        </a>
        
        <div style="grid-column: 1/-1; text-align: center; padding: 3rem;">
            <p>لا توجد مقالات حالياً. جاري توليد المحتوى...</p>
        </div>
        
    </div>
</div>
</body>
</html>
